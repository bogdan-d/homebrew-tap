name: Homebrew Bump

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,15 * * *" # daily at 03:00 and 15:00 UTC

jobs:
  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91 # main

      - name: Configure git
        uses: Homebrew/actions/git-user-config@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91 # main

      - name: Checkout homebrew-core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Homebrew/homebrew-core
          path: homebrew-core
          fetch-depth: 1
          sparse-checkout: |
            Formula/

      - name: Move homebrew-core to tap directory
        run: |
          BREW_REPO="$(brew --repo)"
          CORE_TAP="$BREW_REPO/Library/Taps/homebrew/homebrew-core"

          mkdir -p "$(dirname "$CORE_TAP")"
          rm -rf "$CORE_TAP"
          mv homebrew-core "$CORE_TAP"

          # Prefer this tap when a formula also exists in homebrew/core.
          for formula in Formula/*.rb; do
            find "$CORE_TAP/Formula" -type f -name "$(basename "$formula")" -delete
          done

      - run: brew trust bogdan-d/tap

      - name: Bump packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_DEVELOPER: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          log_file="$(mktemp)"
          set +e
          brew bump --tap ${{ github.repository }} --open-pr --no-fork 2>&1 | tee "$log_file"
          status="${PIPESTATUS[0]}"
          set -e

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          pr_error="Unable to open pull request for ${{ github.repository }}: Failed to parse JSON response"
          if ! grep -Fq "$pr_error" "$log_file"; then
            exit "$status"
          fi

          other_errors="$(grep -F '##[error]' "$log_file" | grep -Fv "$pr_error" || true)"
          if [[ -n "$other_errors" ]]; then
            printf '%s\n' "$other_errors" >&2
            exit "$status"
          fi

          mapfile -t branches < <(grep -oE 'bump-[[:alnum:]._-]+' "$log_file" | sort -u)
          if [[ "${#branches[@]}" -eq 0 ]]; then
            echo "No bump branches found in brew output." >&2
            exit "$status"
          fi

          cd "$(brew --repo ${{ github.repository }})"

          for branch in "${branches[@]}"; do
            if [[ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[0].number // empty')" ]]; then
              echo "PR already exists for $branch"
              continue
            fi

            title="$(git log -1 --format=%s "origin/$branch")"
            if [[ -z "$title" ]]; then
              echo "Missing commit title for $branch" >&2
              exit "$status"
            fi

            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "$title" \
              --body "Created by \`brew bump\`."
          done

      - name: Wait for PRs to be indexed
        if: always()
        run: sleep 20

      - name: Enable auto-merge on created PRs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Include older open bump PRs so transient merge failures are retried.
          for pr_number in $(gh pr list --author "app/github-actions" --search "Created by \`brew bump\`" --json number --jq '.[].number'); do
            merged=false
            for attempt in 1 2 3; do
              if gh pr merge "$pr_number" --auto --merge --delete-branch --subject "Auto-merge PR #$pr_number"; then
                echo "✅ Enabled auto-merge for PR #$pr_number"
                merged=true
                break
              fi
              echo "⚠️ Auto-merge attempt $attempt failed for PR #$pr_number; retrying."
              sleep 10
            done
            if [[ "$merged" == false ]]; then
              echo "⚠️ Auto-merge not enabled for PR #$pr_number — skipping."
            fi
          done
